<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Management System - Add Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Navigation Bar -->
     <header>
        <nav>
            <h2>My Blog App</h2>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="add-blog.html">Add Blog</a></li>
            </ul>
        </nav>
     </header>

     <!-- Main content -->
      <main>
        <section>
            <h1>Create a New Blog Post</h1>

            <!-- Blog Submission Form -->
            <form action="/submit-blog" method="POST">
                <div>
                    <label for="title">Blog Title:</label><br>
                    <input type="text" id="title" name="title" required placeholder="Post Title">
                </div>
                <br>
                <div>
                    <label for="author">Author:</label><br>
                    <input type="text" id="author" name="author" required placeholder="Your name">
                </div>
                <br>
                <div>
                    <label for="content">Blog Content:</label><br>
                    <textarea id="content" name="content" rows="10" cols="50" required placeholder="write post here..."></textarea>
                </div>
                <br>

                <button type="submit">Publish Blog</button>
            </form>
        </section>
      </main>

      <hr>

      <!-- Footer -->
       <footer>
        <p>&copy; 2026 Blog Management System. All rights reserved.</p>
        <p>Contact us at info@blogsystem.com</p>
       </footer>
</body>
</html>
